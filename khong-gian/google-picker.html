<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Chọn tệp Google — BDSG Office</title>
    <link rel="stylesheet" href="/soan-thao.css" />
    <script defer src="/bao-ve-phien.js"></script>
    <script defer src="/google-picker.js"></script>
  </head>
  <body>
    <header>
      <a href="/#office">Về kho tệp</a>
      <h1>Nhập từ Google Drive</h1>
      <p id="status" role="status" aria-live="polite">
        Chọn tệp sẽ cấp quyền cho ứng dụng và tạo bản sao trong dự án.
      </p>
      <button id="pick">Chọn tệp từ Google</button>
    </header>
    <p id="error" role="alert" hidden></p>
    <main id="selection" aria-label="Tệp được chọn"></main>
  </body>
</html>
