name: Thanh Hoa checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install optional Google and Office authentication dependencies
        run: |
          python3 -m pip install --only-binary=:all: -r requirements-office.txt
          python3 -m pip install --only-binary=:all: -r requirements-google-login.txt
      - name: Verify Python interfaces
        run: |
          for check in nhan/thu_*.py; do python3 "$check"; done
          python3 -m unittest discover -s he-dieu-hanh -p 'thu_*.py' -v
          python3 trien-khai/thu_giao_dien.py -v
      - name: Verify browser source
        run: |
          for source in khong-gian/*.js; do node --check "$source"; done
          node khong-gian/thu_mo_dun.cjs
          node khong-gian/thu_xuong.cjs
          node khong-gian/thu_tro_ly.cjs
          git diff --check
